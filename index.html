<button id="generateBtn" onclick="generateReport()">
        ✨ إنشاء التقرير بالذكاء الاصطناعي
      </button>

      <div id="status"></div>

    </section>

    <section class="card" id="reportBox">

      <h2>📄 التقرير</h2>

      <div id="report"></div>

      <button class="print-btn" onclick="window.print()">
        🖨️ طباعة / حفظ PDF
      </button>

    </section>

  </main>

  <div class="footer">
    Reportly © 2026
  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycby4z9GdePfouA870tBQgZ2z7JcSIVI1ebEeGMgjSYHuIzJiKFIvPgb3bar0wKa3boEy5w/exec";


    async function generateReport() {

      const title = document.getElementById("title").value.trim();
      const language = document.getElementById("language").value;
      const pages = document.getElementById("pages").value;

      const button = document.getElementById("generateBtn");
      const status = document.getElementById("status");
      const reportBox = document.getElementById("reportBox");
      const report = document.getElementById("report");


      if (!title) {
        status.textContent = "اكتبي عنوان التقرير أولاً.";
        return;
      }


      button.disabled = true;
      button.textContent = "⏳ جاري إنشاء التقرير...";
      status.textContent = "الذكاء الاصطناعي يكتب التقرير الآن...";
      reportBox.style.display = "none";
      report.textContent = "";


      try {

        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            title: title,
            language: language,
            pages: Number(pages)
          })
        });


        const data = await response.json();


        if (!data.success) {
          throw new Error(
            data.error || "حدث خطأ من خدمة الذكاء الاصطناعي."
          );
        }


        report.textContent = data.report;
        reportBox.style.display = "block";
        status.textContent = "✅ تم إنشاء التقرير بنجاح";


      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ حدث خطأ: " + error.message;

      } finally {

        button.disabled = false;
        button.textContent =
          "✨ إنشاء التقرير بالذكاء الاصطناعي";

      }

    }

  </script>

</body>
</html>
