<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportly</title>

<style>
:root{
  --main:#a65f35;
  --light:#fff7ef;
  --text:#3b2920;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--light);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}

header{
  background:var(--main);
  color:white;
  padding:25px 15px;
  text-align:center;
}

header h1{margin:0;font-size:32px}
header p{margin:8px 0 0}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 15px;
}

.card,#report{
  background:white;
  padding:22px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  margin-bottom:20px;
}

h2{color:var(--main)}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:7px;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:var(--main);
  color:white;
  font-size:17px;
  font-weight:bold;
}

#report{display:none;line-height:1.9}

.report-title{
  text-align:center;
  color:var(--main);
  margin-bottom:30px;
}

.section{margin-top:25px}
.section h3{color:var(--main)}

.color-row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:10px;
}

.color{
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  box-shadow:0 0 0 1px #aaa;
}

.color.active{
  box-shadow:0 0 0 3px #222;
}

.preview-image{
  max-width:100%;
  max-height:350px;
  display:block;
  margin:20px auto;
  border-radius:12px;
}

.actions{
  display:flex;
  gap:10px;
}

.actions button{flex:1}

.secondary{background:#555}

@media(max-width:600px){
  .actions{flex-direction:column}
}

@media print{
  header,.card,.actions{display:none!important}
  #report{
    display:block!important;
    box-shadow:none;
  }
}
</style>
</head>

<body>

<h1>📚 Reportly</h1>
<p>صمّم تقريرك بالطريقة التي تريدها</p>
</header>

<select id="font">

<option value="Times New Roman">Times New Roman</option>
</select>

<select id="fontSize">
<option value="14px">14</option>

<option value="20px">20</option>

<select id="pages">

<option value="10">10 صفحات</option>
</select>
