<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportly AI 🍂</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4eadc;
  color:#4a3024;
}

header{
  background:linear-gradient(135deg,#6b3e26,#a85d32,#d08a45);
  color:white;
  padding:28px 20px;
  text-align:center;
  border-radius:0 0 30px 30px;
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  margin:8px 0 0;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:#fffaf3;
  padding:22px;
  margin-bottom:20px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(90,55,30,.12);
}

h2{
  color:#7a4528;
}

label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin-top:7px;
  border:1px solid #d7b99b;
  border-radius:12px;
  background:white;
  font-size:16px;
}

textarea{
  min-height:350px;
  resize:vertical;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  cursor:pointer;
  font-size:15px;
